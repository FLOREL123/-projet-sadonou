<!DOCTYPE html>
<html lang="fr">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        :root {

        .assoc-nav {

           ============================================ */
       .carte-preview {

<div class="profile-container" id="profileContainer">
    <div class="loading-container">
        <div class="spinner"></div>
        <p>Chargement de votre profil...</p>
    </div>
</div>

<script>
// ============================================
// VARIABLES GLOBALES
// ============================================
let currentUser = null;
let currentProfile = {};

// ============================================
// VÉRIFICATION AUTHENTIFICATION
// ============================================
function checkAuth() {
    if (typeof API === 'undefined') {
        console.error('API non chargée, nouvelle tentative...');
        setTimeout(checkAuth, 200);
        return;
    }
    
    const user = API.Auth.getUser();
    
    if (!user) {
        console.log('Pas connecté → redirection vers accueil');
        window.location.href = 'homepage_professional_tax_services.html';
        return;
    }
    
    currentUser = user;
    currentProfile = user.profile || {};
    
    console.log('Utilisateur connecté:', user);
    
    renderProfile();
}

// ============================================
// CALCUL DE COMPLÉTION
// ============================================
function calculateCompletion() {
    const requiredFields = [
        'sexe',
        'date_naissance',
        'nationalite',
        'ville',
        'pays',
        'metier',
        'telephone',
        'prenom',
        'photo_url'
    ];
    
    let filled = 0;
    const missing = [];
    
    const labels = {
        'sexe': 'Sexe',
        'date_naissance': 'Date de naissance',
        'nationalite': 'Nationalité',
        'ville': 'Ville',
        'pays': 'Pays',
        'metier': 'Métier',
        'telephone': 'Téléphone',
        'prenom': 'Prénom',
        'photo_url': 'Photo de profil'
    };
    
    requiredFields.forEach(field => {
        if (currentProfile[field] && String(currentProfile[field]).trim() !== '') {
            filled++;
        } else {
            missing.push(field);
        }
    });
    
    const percentage = Math.round((filled / requiredFields.length) * 100);
    
    return { percentage, missing, labels };
}

// ============================================
// AFFICHER LE PROFIL
// ============================================
function renderProfile() {
    const container = document.getElementById('profileContainer');
    
    const profile = currentProfile;
    const fullName = (profile.prenom || 'Membre') + ' ' + (profile.nom || '');
    const roles = (currentUser.roles || ['member']).join(', ');
    
    const { percentage, missing, labels } = calculateCompletion();
    const canDownloadCard = percentage >= 80;
    
    const initiales = ((profile.prenom || 'M').charAt(0) + (profile.nom || 'N').charAt(0)).toUpperCase();
    
    container.innerHTML = `
        <div class="profile-header">
            <h1>Mon Profil</h1>
            <p>Consultez et mettez à jour vos informations personnelles.</p>
        </div>

        <div class="profile-grid">
            <div class="profile-card">
                <div class="profile-card-header">
                    <div>
                        <p class="profile-card-title">MON PROFIL</p>
                    </div>
                </div>
                <div class="profile-name">Bonjour ${profile.prenom || 'Membre'}</div>
                <p class="profile-subtitle">Consultez votre fiche. Cliquez sur Modifier pour mettre à jour vos informations.</p>
                <button class="btn-modifier" onclick="toggleForm()">Modifier mes informations</button>
                
                <div class="alert-content" style="margin-top: 1.5rem;">
                    <h4>Informations du compte</h4>
                    <ul class="info-list">
                        <li><span>Nom complet</span> <strong>${fullName}</strong></li>
                        <li><span>Email</span> <strong>${currentUser.email || '--'}</strong></li>
                        <li><span>Matricule</span> <strong>${profile.matricule || '--'}</strong></li>
                        <li><span>Rôles</span> <strong>${roles}</strong></li>
                    </ul>
                </div>
            </div>

            <div class="profile-card">
                <div class="profile-card-header">
                    <div>
                        <p class="profile-card-title">COMPLÉTION DU PROFIL</p>
                    </div>
                </div>

                    </div>
                    
                    <div class="carte-actions">
                        <button class="btn-download" id="downloadBtn" onclick="downloadCartePDF()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>

                    <div class="lock-icon">

                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

                    </div>
                    <h4>Carte de membre verrouillée</h4>
                    <p>Complétez votre profil à <strong>80%</strong> pour débloquer votre carte de membre.</p>

        <form class="profile-form" id="profileForm" onsubmit="saveProfile(event)">
            <h3>Modifier mes informations</h3>

// ✅ MODIFICATION B : chargerLogoCarte() simplifiée

function chargerLogoCarte() {
    const watermark = document.getElementById("carteWatermark");
    if (!watermark) return;

    watermark.onload = () => {
        console.log("Logo chargé");
    };

    watermark.src = "../static/images/logo.jpg";
}

// ============================================
// TÉLÉCHARGER LA CARTE EN PDF
// ============================================
async function downloadCartePDF() {
    const btn = document.getElementById("downloadBtn");
    const carte = document.getElementById("carteMembre");
    const original = btn.innerHTML;

    btn.disabled = true;
    btn.innerHTML = "Génération du PDF...";

    try {
        // Attendre le chargement des images
        const images = [...carte.querySelectorAll("img")];

        await Promise.all(images.map(img => {
            if (img.complete) return Promise.resolve();

            return new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
            });
        }));

        // Petit délai pour stabiliser le rendu
        await new Promise(r => setTimeout(r, 200));

        // Capture HD
        // ⚠️ allowTaint:true fait échouer la capture SANS erreur, mais le canvas
        // reste "tainted" : le navigateur refusera quand même toDataURL() juste après.
        // On le désactive pour que l'erreur CORS remonte ici, avec un message clair.
        const canvas = await html2canvas(carte, {
            scale: 3,
            useCORS: true,
            allowTaint: false,
            backgroundColor: null,
            logging: false
        });

        let imgData;
        try {
            imgData = canvas.toDataURL("image/png");
        } catch (taintErr) {
            throw new Error(
                "Le canvas est \"tainted\" (pollué par une image cross-origin). " +
                "Cause la plus probable : la page est ouverte en local (file://) au lieu " +
                "d'être servie par un serveur web, donc les images locales (ex: logo.jpg) " +
                "sont traitées comme cross-origin. Solutions : 1) ouvrir la page via un " +
                "serveur local (ex: http://localhost:...) au lieu de double-cliquer sur le " +
                "fichier HTML, ou 2) intégrer le logo directement en base64 dans le code."
            );
        }

        const { jsPDF } = window.jspdf;

        // Format carte bancaire
        const pdf = new jsPDF({
            orientation: "landscape",
            unit: "mm",
            format: [85.6, 54]
        });

        pdf.addImage(imgData, "PNG", 0, 0, 85.6, 54);

        const nom = `Carte_Membre_${currentProfile.matricule || "SADONOU"}.pdf`;
        pdf.save(nom);

        btn.innerHTML = "✓ PDF téléchargé";

    } catch (err) {
        console.error(err);
        alert("Impossible de générer le PDF : " + err.message);

    } finally {
        setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = original;
        }, 800);
    }
}
// ============================================
// AFFICHER/MASQUER LE FORMULAIRE
// ============================================
function toggleForm() {
    const form = document.getElementById('profileForm');
    if (form) {
        form.classList.toggle('show');
        if (form.classList.contains('show')) {
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }
}

// ============================================
// UPLOAD PHOTO
// ============================================
function uploadPhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
        alert("La photo ne doit pas dépasser 5 MB.");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        currentProfile.photo_url = e.target.result;
        document.getElementById("photoPreview").src = currentProfile.photo_url;
        document.getElementById("photoPreview").style.display = "block";
        document.getElementById("photoPlaceholder").style.display = "none";
    };
    reader.readAsDataURL(file);
}

// ============================================
// SAUVEGARDER LE PROFIL
// ============================================
async function saveProfile(e) {
    e.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.textContent = "Enregistrement...";
    submitBtn.disabled = true;

    currentProfile.sexe = document.getElementById("sexe").value || null;
    currentProfile.date_naissance = document.getElementById("birthDate").value || null;
    currentProfile.nationalite = document.getElementById("nationality").value || null;
    currentProfile.telephone = document.getElementById("phone").value || null;
    currentProfile.ville = document.getElementById("city").value || null;
    currentProfile.pays = document.getElementById("country").value || null;
    currentProfile.metier = document.getElementById("metier").value || null;

    const updates = {
        sexe: currentProfile.sexe,
        date_naissance: currentProfile.date_naissance,
        nationalite: currentProfile.nationalite,
        telephone: currentProfile.telephone,
        ville: currentProfile.ville,
        pays: currentProfile.pays,
        metier: currentProfile.metier,
        photo_url: currentProfile.photo_url || null
    };

    try {
        const result = await API.Membres.update(currentUser.id, updates);
        
        if (result && result.error) {
            alert("Erreur : " + result.error);
            submitBtn.textContent = "Enregistrer";
            submitBtn.disabled = false;
            return;
        }

        currentUser.profile = currentProfile;
        localStorage.setItem("sadonou_user", JSON.stringify(currentUser));

        submitBtn.textContent = "Enregistrer";
        submitBtn.disabled = false;

        alert("Profil mis à jour avec succès !");
        
        const { percentage } = calculateCompletion();
        if (percentage >= 80 && percentage < 100) {
            setTimeout(() => {
                alert("Félicitations ! Votre carte de membre est débloquée. Vous pouvez la télécharger en PDF.");
            }, 800);
        }
        
        renderProfile();
        
    } catch (err) {
        console.error(err);
        alert("Erreur lors de l'enregistrement.");
        submitBtn.textContent = "Enregistrer";
        submitBtn.disabled = false;
    }
}

// ============================================
// DÉCONNEXION
// ============================================
function logout() {
    if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
        API.Auth.logout();
    }
}

// ============================================

// INITIALISATION
// ============================================
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkAuth);
} else {
    checkAuth();
}
</script>
