<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Association SADONOU</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Fraunces', serif; }
        
        :root {
            --vert: #2d6a4f;
            --bleu: #1d3557;
            --jaune: #f4a261;
            --orange: #e76f51;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bleu) 0%, var(--vert) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            max-width: 420px;
            width: 100%;
            margin: 1rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            color: var(--bleu);
            margin: 0 0 0.5rem 0;
        }

        .login-header p {
            color: #6c757d;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--bleu);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--bleu);
            box-shadow: 0 0 0 3px rgba(29, 53, 87, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px 24px;
            background: var(--bleu);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background: var(--vert);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(29, 53, 87, 0.3);
        }

        .btn-back {
            text-align: center;
            margin-top: 1.5rem;
        }

        .btn-back a {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .btn-back a:hover {
            color: var(--bleu);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Admin Panel</h1>
            <p>Connectez-vous à votre espace d'administration</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Mot de passe administrateur</label>
                <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required />
            </div>

            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        <div class="btn-back">
            <a href="homepage_professional_tax_services.html">← Retour à l'accueil</a>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123'; // Mot de passe par défaut

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (password === ADMIN_PASSWORD) {
                // Stocker le token de session
                localStorage.setItem('adminToken', 'logged_in_' + Date.now());
                localStorage.setItem('adminLoginTime', new Date().toISOString());
                
                successMsg.textContent = '✓ Connexion réussie! Redirection en cours...';
                successMsg.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'admin_dashboard.html';
                }, 1500);
            } else {
                errorMsg.textContent = '✗ Mot de passe incorrect!';
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });

        // Vérifier si déjà connecté
        if (localStorage.getItem('adminToken')) {
            window.location.href = 'admin_dashboard.html';
        }
    </script>
</body>
</html>
