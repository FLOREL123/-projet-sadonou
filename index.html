<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Association SADONOU</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1d3557 0%, #2d6a4f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .loader {
            text-align: center;
            padding: 2rem;
        }
        .loader h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .loader p {
            opacity: 0.8;
            font-size: 1.2rem;
        }
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #f4a261;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-redirect {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 12px 30px;
            background: #f4a261;
            color: #1d3557;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn-redirect:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="loader">
        <h1>🏛️ Association SADONOU</h1>
        <div class="spinner"></div>
        <p>Chargement du site...</p>
        <a href="pages/homepage_professional_tax_services.html" class="btn-redirect">
            Accéder au site →
        </a>
    </div>
    <script>
        // Redirection automatique vers la page d'accueil
        setTimeout(function() {
            window.location.href = 'pages/homepage_professional_tax_services.html';
        }, 2000);
    </script>
</body>
</html>
