<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Association SADONOU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1d3557 0%, #2d6a4f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            padding: 1rem;
        }
        .container { max-width: 500px; }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        h1 span { color: #f4a261; }
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #f4a261;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 1.5rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #f4a261;
            color: #1d3557;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
            margin-top: 1rem;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .links {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .links a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .links a:hover { color: #f4a261; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ <span>SADONOU</span></h1>
        <p class="subtitle">Association Alladaxónou Houègbonou</p>
        <div class="spinner"></div>
        <a href="pages/homepage_professional_tax_services.html" class="btn">
            Accéder au site →
        </a>
        <div class="links">
            <a href="pages/admin_login.html">🔐 Administration</a>
        </div>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = 'pages/homepage_professional_tax_services.html';
        }, 2500);
    </script>
</body>
</html>
